[project]
name = "policybook-backend"
version = "0.1.0"
description = "PolicyBook Backend Application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "alembic>=1.13.0",
    "cryptography>=43.0.0",
    "pyyaml>=6.0.2",
    "httpx>=0.27.0",
    "python-ulid>=3.0.0",
    "pymupdf>=1.24.0",
    "pillow>=10.4.0",
    "pillow-heif>=0.18.0",
    "rapidocr-onnxruntime>=1.3.0",
    "python-pptx>=1.0.0",
    "apscheduler>=3.10.4",
    "icalendar>=6.0.0",
    "openai>=1.45.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

